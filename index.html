<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLD WAR F2</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;
            background: #101820;
            color: white;
        }

        .header {
            padding: 25px;
            text-align: center;
            background: #18242e;
            border-bottom: 2px solid #d4af37;
        }

        .header h1 {
            font-size: 30px;
            letter-spacing: 3px;
            color: #d4af37;
        }

        .header p {
            color: #aab4bc;
            margin-top: 8px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .status {
            background: #18242e;
            border: 1px solid #30404d;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status h2 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat {
            background: #101820;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            border: 1px solid #30404d;
        }

        .stat b {
            display: block;
            font-size: 20px;
            color: #d4af37;
            margin-top: 5px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: #18242e;
            border: 1px solid #30404d;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #d4af37;
        }

        .card .icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .card h3 {
            color: #d4af37;
            margin-bottom: 8px;
        }

        .card p {
            color: #aab4bc;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>🌍 WORLD WAR F2</h1>
        <p>مرکز فرماندهی جهانی</p>
    </header>

    <main class="container">

        <section class="status">
            <h2>🏳️ وضعیت کشور</h2>

            <div class="stats">
                <div class="stat">
                    💰 اقتصاد
                    <b>$ 100B</b>
                </div>

                <div class="stat">
                    👥 جمعیت
                    <b>50M</b>
                </div>

                <div class="stat">
                    🛡️ قدرت
                    <b>75</b>
                </div>
            </div>
        </section>

        <section class="menu">

            <div class="card">
                <div class="icon">🗺️</div>
                <h3>نقشه جهان</h3>
                <p>مشاهده وضعیت کشورهای جهان</p>
            </div>

            <div class="card">
                <div class="icon">📊</div>
                <h3>اقتصاد</h3>
                <p>مدیریت منابع و توسعه کشور</p>
            </div>

            <div class="card">
                <div class="icon">🤝</div>
                <h3>دیپلماسی</h3>
                <p>اتحادها و روابط بین کشورها</p>
            </div>

            <div class="card">
                <div class="icon">📰</div>
                <h3>اخبار جهان</h3>
                <p>آخرین اتفاقات بازی</p>
            </div>

        </section>

    </main>

</body>
</html>
